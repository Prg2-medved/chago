      "id": "q01",
      "question": "Как работает роутплан?",
      "tags": [
        "text",
        "identifier"
      ],
      "split": "tuning",
      "source_set": "live",
      "answerable": true,
      "expected_behavior": "answer",
      "required_facts": [
        {
          "text": "Получает этапы, состоящие из сегментов управления одним устройством.",
          "evidence_ids": [
            "q01-e1"
          ]
        },
        {
          "text": "Этапы разных маршрутов выполняются конкурентно.",
          "evidence_ids": [
            "q01-e2"
          ]
        },
        {
          "text": "Для этапа создаёт и контролирует маршрут с последовательными сегментами и шагами.",
          "evidence_ids": [
            "q01-e3"
          ]
        }
      ],
