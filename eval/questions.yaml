          "page_id": 19,
          "locale": "ru",
          "path": "kamchatka/Микросервисы/rb-route-plan",
          "content_sha256": "ff58a5b88759d93cd041c6bc3ea741e536419336af7bbc7e12e08fdcfbb13c1b",
          "spans": [
            {
              "start": 18638,
              "end": 18792,
              "exact_text": "- Сервис получает на вход Этапы и данные для их выполнения. Этап представляет собой список сегментов.\n- Сегмент - задания на управление одним устройством."
            }
          ],
          "heading_path": [
            "Обработка этапов"
          ]
        },
        {
          "id": "q01-e2",
          "page_id": 19,
          "locale": "ru",
          "path": "kamchatka/Микросервисы/rb-route-plan",
          "content_sha256": "ff58a5b88759d93cd041c6bc3ea741e536419336af7bbc7e12e08fdcfbb13c1b",
          "spans": [
            {
              "start": 19100,
              "end": 19149,
              "exact_text": "- Этапы разных маршрутов выполняются конкурентно."
            }
          ],
          "heading_path": [
            "Обработка этапов"
          ]
        },
        {
          "id": "q01-e3",
          "page_id": 19,
          "locale": "ru",
          "path": "kamchatka/Микросервисы/rb-route-plan",
          "content_sha256": "ff58a5b88759d93cd041c6bc3ea741e536419336af7bbc7e12e08fdcfbb13c1b",
          "spans": [
            {
              "start": 19150,
              "end": 19347,
              "exact_text": "- Для каждого этапа сервис создает отдельый маршрут и контроллирует его выполнение до завершения. Маршрут включает в себя последовательные сегменты, которые содержат пути, по которым строятся шаги."
