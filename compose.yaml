services:
  app:
    build: ./app
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://llm:8080}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME:-Qwen3-4B-Instruct-2507}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-768}"
      WIKI_DB_HOST: "${WIKI_DB_HOST:-}"
      WIKI_DB_PORT: "${WIKI_DB_PORT:-5432}"
      WIKI_DB_NAME: "${WIKI_DB_NAME:-}"
      WIKI_DB_USER: "${WIKI_DB_USER:-}"
      WIKI_DB_PASSWORD: "${WIKI_DB_PASSWORD:-}"
      WIKI_DB_VIEW: "${WIKI_DB_VIEW:-rag.rag_wikijs_pages_v1}"
      WIKI_DB_TIMEOUT_SECONDS: "${WIKI_DB_TIMEOUT_SECONDS:-30}"
      WIKI_SOURCE_ORIGIN: "${WIKI_SOURCE_ORIGIN:-}"
      EMBEDDING_MODEL_PATH: "${EMBEDDING_MODEL_PATH:-/data/models/614241f622f53c4eeff9890bdc4f31cfecc418b3}"
      EMBEDDING_MODEL_ID: "${EMBEDDING_MODEL_ID:-intfloat/multilingual-e5-small}"
      EMBEDDING_MODEL_REVISION: "${EMBEDDING_MODEL_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-16}"
      EMBEDDING_CPU_THREADS: "${EMBEDDING_CPU_THREADS:-4}"
    volumes:
      - ./data:/data
    networks:
      - default
      - wiki_default
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"

  llm:
    # Preliminary CPU tag: replace LLM_IMAGE with a verified RepoDigest before acceptance.
    image: "${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}"
    pull_policy: never
    volumes:
      - type: bind
        source: "${LLM_MODEL_PATH:-./models/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf}"
        target: /models/model.gguf
        read_only: true
        bind:
          create_host_path: false
    command:
      - --model
      - /models/model.gguf
      - --alias
      - "${LLM_MODEL_NAME:-Qwen3-4B-Instruct-2507}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${LLM_CONTEXT_SIZE:-8192}"
      - --threads
      - "${LLM_THREADS:-8}"
      - --threads-batch
      - "${LLM_THREADS:-8}"
      - --parallel
      - "1"
      - --gpu-layers
      - "0"
      - --device
      - none
      - --no-webui

networks:
  default:
  wiki_default:
    external: true
    name: wiki_default
